<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Cybernetic Circuit Node Points -->
  <circle cx="32" cy="14" r="1.5" fill="#22d3ee" opacity="0.8"/>
  <circle cx="20" cy="19" r="1.2" fill="#10b981" opacity="0.8"/>
  <circle cx="44" cy="19" r="1.2" fill="#10b981" opacity="0.8"/>
  <line x1="32" y1="14" x2="32" y2="20" stroke="#22d3ee" stroke-width="1" opacity="0.6"/>

  <!-- Infinity + Chevron Mark -->
  <g filter="url(#glow)">
    <!-- Infinity loop base -->
    <path d="M23 27 C 15 27, 13 37, 23 40 C 31 43, 33 24, 41 27 C 51 30, 49 40, 41 40 C 33 40, 31 32, 23 27 Z" 
          fill="none" 
          stroke="url(#neonGrad)" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Central Bold V -->
    <path d="M19 22 L 32 49 L 45 22" 
          fill="none" 
          stroke="url(#neonGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
